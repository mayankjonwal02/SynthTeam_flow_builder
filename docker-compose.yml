version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: synthteam_postgres
    restart: always
    environment:
      POSTGRES_USER: synthuser
      POSTGRES_PASSWORD: synthpass
      POSTGRES_DB: synthdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthuser -d synthdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: synthteam_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: synthteam_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

  celery:
    build: ./backend
    container_name: synthteam_celery
    command: celery -A app.celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
